[project]
name = "boardgames-recsys"
version = "0.1.0"
description = "Explainable board-game recommendation systems research project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dash>=3.0",
    "dash-bootstrap-components>=2.0",
    "dash-deck>=0.0.1",
    "dash-extensions>=2.0",
    "matplotlib>=3.8",
    "nltk>=3.9",
    "numpy>=1.26",
    "ollama>=0.5",
    "pandas>=2.2",
    "pillow>=10.0",
    "plotly>=6.0",
    "pydeck>=0.9",
    "rouge>=1.0",
    "sacrebleu>=2.5",
    "scikit-learn>=1.5",
    "scikit-surprise>=1.1",
    "scipy>=1.13",
    "seaborn>=0.13",
    "treetaggerwrapper>=2.3",
    "unidecode>=1.3",
]

[project.scripts]
boardgames-recsys-app = "boardgames_recsys.app.app:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "nbstripout>=0.8",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardgames_recsys"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
